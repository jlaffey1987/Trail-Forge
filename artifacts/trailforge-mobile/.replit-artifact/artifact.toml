kind = "mobile"
previewPath = "/mobile/"
title = "TrailForge Mobile"
version = "1.0.0"
id = "artifacts/trailforge-mobile"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/mobile/" ]
localPort = 19421

[services.development]
run = "pnpm --filter @workspace/trailforge-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/trailforge-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/trailforge-mobile", "run", "serve" ]

[services.env]
PORT = "19421"
BASE_PATH = "/mobile/"
